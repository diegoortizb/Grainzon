spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/grainzon}
spring.datasource.username=${DB_USER:grainzon}
spring.datasource.password=${DB_PASSWORD:grainzon}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# App logs at INFO by default. For debug logs, set the environment variable LOGGING_LEVEL_COM_GRAINZON=DEBUG.
logging.level.com.grainzon=INFO
